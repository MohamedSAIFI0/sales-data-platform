x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-policy
  restart: unless-stopped

x-common-env: &common-env
  TZ: "UTC"

networks:
  internal:
    driver: bridge
  external:
    external: true
    name: shared-sales-data-network

volumes:
  postgres-data:
  kafka-data:
  zookeeper-data:
  cassandra-data:
  minio-data:
  spark-logs:
  superset-data:

services:

  # POSTGRES
  postgres:
    image: postgres:16
    container_name: postgres
    <<: *restart-policy
    networks:
      - internal
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    <<: *restart-policy
    networks:
      - internal
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # KAFKA
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    <<: *restart-policy
    networks:
      - internal
      - external
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging

# KAFKA CONNECT
  kafka-connect:
    image: kafka-connect-custom
    container_name: kafka-connect
    <<: *restart-policy
    networks:
      - internal
      - external
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: connect-cluster

      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components

      KAFKA_OPTS: "-Dcom.amazonaws.sdk.disableCertChecking=true"

      AWS_ACCESS_KEY_ID: saifi
      AWS_SECRET_ACCESS_KEY: PSSwOrd123
      AWS_REGION: us-east-1

      S3_ENDPOINT: http://minio:9000

    logging: *default-logging
    volumes:
      - /home/laila/Desktop/sales-data-plateform/data/data_generator:/data/data_generator


  # SPARK MASTER
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    <<: *restart-policy
    networks:
      - internal
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    volumes:
      - spark-logs:/opt/spark/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # SPARK WORKER
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    <<: *restart-policy
    networks:
      - internal
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      - spark-logs:/opt/spark/logs
    logging: *default-logging

  # CASSANDRA
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    <<: *restart-policy
    networks:
      - internal
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *default-logging

  # MINIO

  minio:
    image: minio/minio
    container_name: minio
    <<: *restart-policy
    networks:
      - internal
      - external
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # TRINO
  trino:
    image: trinodb/trino:435
    container_name: trino
    <<: *restart-policy
    networks:
      - internal
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    volumes:
      - ../analytics/trino/catalog:/etc/trino/catalog

  # SUPERSET
  superset:
    build:
      context: ..
      dockerfile: docker/superset/Dockerfile
    container_name: superset
    <<: *restart-policy
    networks:
      - internal
      - external
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset_db
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset-data:/app/superset_home
    logging: *default-logging

  # OPENMETADATA

  openmetadata:
    image: openmetadata/server:1.3.0
    container_name: openmetadata
    <<: *restart-policy
    networks:
      - internal
      - external
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8585:8585"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /opt/openmetadata
        sh bootstrap/bootstrap_storage.sh migrate-all
        sh /openmetadata-start.sh
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_USER_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${OM_DB}
      OM_DATABASE: ${OM_DB}
      DB_PARAMS: ""
      DB_CONNECTION_URL: jdbc:postgresql://postgres:5432/${OM_DB}
      OM_DATABASE_HOST: postgres
      OM_DATABASE_PORT: 5432
      OM_DATABASE_USER: ${POSTGRES_USER}
      OM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      OM_DATABASE_NAME: ${OM_DB}
    logging: *default-logging
